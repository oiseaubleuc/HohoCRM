<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nebula — Downloads (macOS)</title>
  <meta name="description" content="Download Nebula voor macOS: .pkg installer, .dmg of native app zip." />
  <link rel="icon" href="/nebula-logo.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#06060a; --surface:#0b0d12; --border:#1c2230; --accent:#5eb5ff; --accent2:#9b7cff; --text:#e8eaf4; --muted:#8b92a8; --ok:#3ecf8e; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px 48px; }
    h1 { font-size: clamp(1.5rem, 4vw, 2rem); margin: 0 0 8px; letter-spacing: -0.02em; }
    .sub { color: var(--muted); margin: 0 0 28px; font-size: 15px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px 18px; margin-bottom: 12px; }
    .card h2 { margin: 0 0 6px; font-size: 14px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; }
    .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
    .meta { font: 12px/1.4 'JetBrains Mono', monospace; color: var(--muted); }
    a.btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 18px; border-radius: 10px; font-weight: 700; font-size: 14px; text-decoration: none; background: var(--accent); color: #fff; border: none; }
    a.btn:hover { opacity: 0.92; }
    a.btn[disabled], a.btn.disabled { opacity: 0.45; pointer-events: none; background: #3a4558; }
    a.ghost { color: var(--accent); font-weight: 600; font-size: 14px; text-decoration: none; }
    a.ghost:hover { text-decoration: underline; }
    .err { color: #f87171; font-size: 14px; margin-top: 12px; }
    code { font-size: 12px; background: var(--surface); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border); }
    footer { margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Nebula — macOS downloads</h1>
    <p class="sub">Installeer de native app via <strong>.pkg</strong> (aanbevolen) of open de <strong>.dmg</strong>. Manifest: <code id="mf">…</code></p>
    <div id="cards"></div>
    <p class="err" id="err" hidden></p>
    <footer>
      CLI: <code>./scripts/download-nebula-pkg.sh -a https://jouw-api</code> of
      <code>node scripts/download-nebula-pkg.mjs --manifest …</code><br />
      API: <code>GET /v1/releases/latest</code> — zelfde JSON als dit manifest.
    </footer>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var manifestUrl = params.get('manifest') || '/releases/nebula-release-manifest.json';
      document.getElementById('mf').textContent = manifestUrl;

      function fmtBytes(n) {
        if (n == null || n === '') return '—';
        var u = ['B', 'KB', 'MB', 'GB'];
        var i = 0;
        var x = Number(n);
        while (x >= 1024 && i < u.length - 1) { x /= 1024; i++; }
        return (i === 0 ? x : x.toFixed(1)) + ' ' + u[i];
      }

      function card(title, key, data, version) {
        var url = data && data.url;
        var ok = url && String(url).trim().length > 0;
        var el = document.createElement('div');
        el.className = 'card';
        el.innerHTML =
          '<h2>' + title + '</h2>' +
          '<div class="row">' +
          '<div class="meta">' +
          (data.filename || key) + '<br />' +
          'v' + version + ' · ' + fmtBytes(data.bytes) +
          (data.sha256 ? '<br />sha256: ' + data.sha256.slice(0, 16) + '…' : '') +
          '</div>' +
          '<a class="btn' + (ok ? '' : ' disabled') + '" href="' + (ok ? url : '#') + '" ' + (ok ? 'download rel="noopener"' : '') + '>Download</a>' +
          '</div>';
        return el;
      }

      fetch(manifestUrl, { credentials: 'omit' })
        .then(function (r) {
          if (!r.ok) throw new Error('Manifest HTTP ' + r.status);
          return r.json();
        })
        .then(function (m) {
          var root = document.getElementById('cards');
          root.textContent = '';
          var ver = m.version || '?';
          [['macOS installer (.pkg)', 'pkg'], ['Disk image (.dmg)', 'dmg'], ['Native app (.zip)', 'nativeZip']].forEach(function (t) {
            root.appendChild(card(t[0], t[1], m[t[1]] || {}, ver));
          });
        })
        .catch(function (e) {
          document.getElementById('err').hidden = false;
          document.getElementById('err').textContent = String(e.message || e);
        });
    })();
  </script>
</body>
</html>
