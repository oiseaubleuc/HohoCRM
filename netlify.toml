# https://docs.netlify.com/configure-builds/file-based-configuration/
[build]
  # Root npm = nodemailer voor Netlify Function; daarna webapp build
  command = "npm ci && cd webapp && npm ci && npm run build"
  publish = "webapp/dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

# Vitrine staat onder public/vitrine/; zonder rewrite kan /vitrine soms niet naar index.html resolven.
[[redirects]]
  from = "/vitrine"
  to = "/vitrine/index.html"
  status = 200

[[redirects]]
  from = "/downloads"
  to = "/downloads/index.html"
  status = 200

# Oude bookmark / CDN-paden naar logo
[[redirects]]
  from = "/nebula-logo.png"
  to = "/orion-logo.png"
  status = 301

[[redirects]]
  from = "/releases/nebula-release-manifest.json"
  to = "/releases/orion-release-manifest.json"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
